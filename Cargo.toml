[package]
name = "stock-ipo-reminder"
version = "0.2.2"
edition = "2024"
build = "build.rs"

[[bin]]
name = "StockIpoReminder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
lopdf = "0.38"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "cookies", "deflate", "gzip", "json", "multipart", "rustls-tls"] }
raw-window-handle = "0.6"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
sha2 = "0.10"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "raw-window-handle-06", "compat-1-2"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_EventNotificationService",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
